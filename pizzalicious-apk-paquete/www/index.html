<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pizzalicious Calpe: turno de noche</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800&display=swap">
<style>
:root{--wall:#2b5c4f;--tile:#357062;--wood:#9a6137;--wood2:#7d4b29;--tomato:#d23b24;--paper:#fff6e2;--ink:#2a1a10;--ok:#4caf50;--warn:#f0a020;--bad:#c62828;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wall:#1d4036;--tile:#245247;--wood:#7a4a2a;--wood2:#5f3a21;--paper:#f1e3c2}}
:root[data-theme="dark"]{--wall:#1d4036;--tile:#245247;--wood:#7a4a2a;--wood2:#5f3a21;--paper:#f1e3c2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--wood2);font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--wood2);color:var(--paper)}
#clk{font-family:"Bowlby One",Impact,sans-serif;font-size:21px;min-width:60px}
#lv{font-weight:800;font-size:12px;background:var(--tomato);padding:2px 8px;border-radius:10px;white-space:nowrap}
.dayb{flex:1;height:8px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}
.dayb i{display:block;height:100%;width:0;background:var(--warn)}
#money{font-weight:800;font-size:15px;text-align:right;white-space:nowrap}#money small{font-size:11px;opacity:.8}
.front{flex:0 0 32%;position:relative;background-image:repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px),repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.07) 39px 40px);background-color:var(--tile)}
.sign{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:var(--tomato);color:#fff;font-family:"Bowlby One",Impact,sans-serif;font-size:13px;padding:3px 12px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
.spots{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding:0 6px 6px}
.spot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;padding-bottom:2px;border-radius:12px}
.serving .spot[data-i]{cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{50%{background:rgba(255,246,226,.18)}}
.bub{background:var(--paper);border-radius:14px;padding:4px 7px;text-align:center;font-size:10.5px;line-height:1.2;position:relative;margin-bottom:8px;box-shadow:0 2px 0 rgba(0,0,0,.25);max-width:100%}
.bub b{display:block;font-size:12.5px}
.bub:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.face{font-size:54px;line-height:1}
.pb{width:70%;height:7px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:4px}
.pb i{display:block;height:100%;width:100%;background:var(--ok)}
.angry .face{animation:shake .25s infinite}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#toast{position:absolute;left:50%;top:36px;transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;font-weight:800;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:3}
#toast.on{opacity:1}
.edge{height:14px;background:linear-gradient(var(--wood),var(--wood2));border-top:3px solid #c48a55}
.prep{flex:1;min-height:0;background:var(--wood);background-image:repeating-linear-gradient(90deg,transparent 0 58px,rgba(0,0,0,.08) 58px 60px);padding:10px;display:flex;flex-direction:column;gap:8px}
.top{display:grid;grid-template-columns:140px 1fr;gap:10px;flex:0 0 auto;height:210px}
.boardw{display:flex;flex-direction:column;align-items:center;gap:6px}
.board{width:140px;height:136px;border-radius:16px;background:#e8d3a8;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #c9ae7c,0 3px 0 rgba(0,0,0,.3);font-size:13px;text-align:center;padding:6px}
.acts{display:flex;gap:5px;width:100%}
.acts button{flex:1;border:0;border-radius:12px;padding:9px 2px;font-weight:800;font-size:13px;background:var(--paper);box-shadow:0 3px 0 rgba(0,0,0,.3)}
#bake{flex:2;background:var(--tomato);color:#fff}
.oven{display:grid;grid-template-rows:repeat(3,1fr);gap:6px;background:#3a2a22;border-radius:14px;padding:8px;box-shadow:inset 0 0 0 3px #1f1511}
.slot{display:grid;grid-template-columns:50px 1fr;grid-template-rows:1fr auto;column-gap:8px;align-items:center;background:#1f1511;border-radius:10px;padding:4px 8px;color:#f4e6cf;font-size:12px;font-weight:800}
.slot.ready{box-shadow:0 0 0 2px var(--ok)}.slot.sel{box-shadow:0 0 0 3px #fff;background:#3b2a1d}
.slot.burnt{box-shadow:0 0 0 2px var(--bad)}
.slot .mini{grid-row:1/3;display:flex;justify-content:center}
.ob{height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden;align-self:end;margin-bottom:6px}
.ob i{display:block;height:100%;width:0;background:var(--warn)}
.slot.ready .ob i{background:var(--ok)}.slot.burnt .ob i{background:var(--bad)}
.ings{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;overflow-y:auto;flex:1 1 auto;min-height:0;align-content:start;padding-bottom:4px}
.ings button{border:0;border-radius:12px;background:var(--paper);padding:4px 0 3px;box-shadow:0 3px 0 rgba(0,0,0,.3);font-size:9.5px;line-height:1.1;text-align:center;font-weight:800;display:flex;flex-direction:column;align-items:center;min-height:46px}
.ings button b{font-size:20px;line-height:1.1}
.ings button.new{outline:3px solid var(--warn)}
.ings button:active,.acts button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.pz{position:relative;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,#f6dfa8 0 68%,#d9a85a 69% 100%);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pz .sa{position:absolute;inset:9%;border-radius:50%;background:var(--tomato)}
.pz .ch{position:absolute;inset:13%;border-radius:50%;background:#f7c948;opacity:.92}
.pz .tp{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*.15);line-height:1}
.pz.ready{filter:sepia(.35) saturate(1.3)}.pz.burnt{filter:brightness(.3) sepia(.6)}
.ov{position:fixed;inset:0;background:rgba(20,10,5,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.ov.off{display:none}
.card{background:var(--paper);border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;max-height:92vh;overflow:auto}
.card h1{font-family:"Bowlby One",Impact,sans-serif;font-weight:400;font-size:26px;margin:0 0 10px;line-height:1.1}
.card p{margin:6px 0;font-size:14px;line-height:1.4;text-align:left}
.card .big{font-size:34px;text-align:center;margin:4px 0}
.card button{margin-top:14px;border:0;border-radius:14px;background:var(--tomato);color:#fff;font-weight:800;font-size:18px;padding:12px 28px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.card a{display:block;margin-top:12px;font-size:12px;text-decoration:underline;cursor:pointer}
.sz{display:flex;align-items:center;justify-content:center;gap:4px;border-radius:8px;padding:2px 4px;margin:2px 0 3px;font-style:normal;font-weight:800;font-size:9.5px;background:#e8d3a8;white-space:nowrap}
.sz.f{background:var(--tomato);color:#fff}
.sz i{width:var(--d);height:var(--d);border-radius:50%;background:radial-gradient(#f4c95d 0 55%,#d9a85a 56%);flex:none}
.acts #size.f{background:var(--tomato);color:#fff}
#st{position:absolute;left:8px;top:34px;font-size:12px;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tabs{display:flex;gap:5px;width:100%}.tabs button{flex:1;border:0;border-radius:8px;padding:3px 0;font-weight:800;font-size:12px;background:rgba(255,255,255,.35);color:var(--ink)}.tabs button.on{background:var(--paper);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.oven.two{grid-template-columns:1fr 1fr}.oven.two .slot{grid-template-columns:36px 1fr;font-size:10px;padding:3px 5px;column-gap:5px}
.shop,.rl{display:flex;flex-direction:column;gap:8px;margin-top:8px;max-height:46vh;overflow-y:auto}
.it,.rr{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.07);border-radius:12px;padding:8px 10px;text-align:left;font-size:13px}
.it small{font-size:11px}
.card .it button{margin:0;padding:8px 10px;font-size:14px;white-space:nowrap}.card .it button.no{opacity:.5}
.rr b{min-width:28px}.rr span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rr em{font-style:normal;font-weight:800;white-space:nowrap}.rr.me{background:rgba(210,59,36,.2)}
.crew{display:none;justify-content:flex-end;align-items:center;gap:2px;font-size:24px;line-height:1}
.crew:before{content:"Ayudantes";margin-right:auto;font-size:11px;font-weight:800;color:var(--paper)}
@media (prefers-reduced-motion:no-preference){.crew span{display:inline-block;animation:bob 1s ease-in-out infinite}}
@keyframes bob{50%{transform:translateY(-3px)}}
.fx{position:fixed;left:0;top:0;width:56px;height:56px;pointer-events:none;z-index:30;will-change:transform}
.fx i{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:22px;font-style:normal;line-height:1}
.fx.p{width:auto;height:auto;font-size:16px;line-height:1}
.blks{max-height:52vh;overflow-y:auto;margin-top:8px}
.blk .map{display:none;margin-top:4px}.blk.open .map{display:grid}
.card .bh{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;margin:6px 0 0;padding:10px 12px;font-size:14px;border-radius:12px;background:var(--ok);box-shadow:0 3px 0 rgba(0,0,0,.3);text-align:left}
.card .bh.cur{background:var(--tomato)}.card .bh.lock{background:#8b8478}
.bh span{font-size:12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.card .tile{display:flex;flex-direction:column;align-items:center;gap:2px;margin:0;padding:12px 4px 8px;border-radius:16px;background:linear-gradient(160deg,#fff,#f2dfb4);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);font-size:13px}
.tile b{font-size:32px;line-height:1.1}.tile span{font-weight:800}.tile i{font-style:normal;font-size:10px;letter-spacing:2px;color:var(--tomato)}
.card .tile.on{outline:3px solid var(--tomato);outline-offset:2px;transform:translateY(-2px)}
.det{margin-top:12px;background:rgba(0,0,0,.07);border-radius:14px;padding:10px 12px;text-align:left;min-height:96px}
.det h3{margin:0 0 4px;font-size:16px}.det p{margin:4px 0;font-size:13px}.det .msg{font-weight:800;color:var(--tomato)}
.det .row{display:flex;gap:8px}.card .det button{flex:1;margin:10px 0 0;padding:10px;font-size:15px}.card .det button.sec{background:var(--wood2)}.card .det button.no{opacity:.5}
.c2{display:none;align-items:center;gap:8px;padding:3px 10px;background:linear-gradient(var(--wood2),#5f3a21);border-top:2px solid #c48a55;color:var(--paper);font-size:11px;font-weight:800}
.wk{font-size:24px;line-height:1;flex:none}.wk.go{animation:wkgo 1.2s ease-in-out}
@keyframes wkgo{0%,100%{transform:translateX(0)}30%{transform:translateX(40px)}70%{transform:translateX(-10px)}}
.tk{display:flex;gap:5px;flex:1;overflow-x:auto;white-space:nowrap}
.tk span{background:var(--paper);color:var(--ink);border-radius:8px;padding:2px 6px;flex:none}
.c2{display:flex;align-items:stretch;gap:6px;padding:4px 8px;height:44px}
.tray{flex:0 0 26%;display:flex;gap:3px;align-items:center;justify-content:center;background:rgba(0,0,0,.25);border-radius:8px;overflow:hidden;line-height:1}
.lane{position:relative;flex:1;border-radius:8px;background:rgba(255,255,255,.08)}
.emp{position:absolute;bottom:2px;font-size:22px;line-height:1;transform:translateX(-50%)}
.emp small{position:absolute;left:50%;top:-12px;transform:translateX(-50%);font-size:12px}
.mk{position:absolute;top:2px;transform:translateX(-50%);font-style:normal;font-size:9px;opacity:.6;font-weight:800}
.hud button{border:0;border-radius:10px;background:rgba(255,255,255,.15);color:var(--paper);font-size:16px;padding:3px 9px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px;max-height:44vh;overflow-y:auto;padding:8px 6px}
.card .map button{position:relative;width:100%;aspect-ratio:1;margin:0;padding:0;border-radius:50%;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.3);background:var(--ok)}
.card .map button.cur{background:var(--tomato)}.card .map button.lock{background:#8b8478;opacity:.7}
.card .map button.on{outline:3px solid var(--ink);outline-offset:2px}
.map u{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 1px 0 rgba(0,0,0,.4);font-size:13px;line-height:22px;text-decoration:none}
.card .stack button{display:block;width:100%;margin:10px 0 0}
.card .stack button.sec{background:var(--wood2);font-size:16px}
#mi{font-size:13px;min-height:58px}
@media (prefers-reduced-motion:reduce){.serving .spot[data-i],.angry .face{animation:none}}
</style>
</head>
<body>
<div id="app">
 <header class="hud"><div id="clk">19:00</div><div id="lv">Nv 1</div><div class="dayb"><i id="dayb"></i></div><div id="money"></div><button id="snd" aria-label="Sonido">🔊</button><button id="pause" aria-label="Pausa">⏸</button></header>
 <section class="front"><div class="sign">PIZZALICIOUS CALPE</div><div id="st"></div><div class="spots" id="spots"></div><div id="toast"></div></section>
 <div class="edge"></div><div class="c2" id="c2"><div class="tray" id="tray"></div><div class="lane" id="lane"></div></div>
 <section class="prep"><div class="crew" id="crew"></div>
  <div class="top">
   <div class="boardw"><div class="board" id="board"></div><div class="tabs" id="tabs"></div>
    <div class="acts"><button id="trash" aria-label="Tirar masa">🗑️</button><button id="size">30 cm</button><button id="bake">Hornear</button></div></div>
   <div class="oven" id="oven"></div>
  </div>
  <div class="ings" id="ings"></div>
 </section>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>
<script>
(()=>{
const $=s=>document.querySelector(s),rnd=n=>Math.floor(Math.random()*n);
const BI=[['dough','🫓','Masa'],['sauce','🥫','Tomate'],['oreg','🌿','Orégano'],['cheese','🧀','Queso']];
const TP=[['bacon','🥓','Bacon'],['york','🍖','Jamón york'],['pep','🔴','Pepperoni'],['onion','🧅','Cebolla'],['pine','🍍','Piña'],['carb','🥛','S. carbonara'],['beef','🥩','Ternera'],['bbq','🔥','S. barbacoa'],['mush','🍄','Champiñones'],['jala','🫑','Jalapeños'],['garlic','🧄','Ajo'],['gambas','🦐','Gambas'],['cherry','🍒','Tomate cherry'],['eggr','🍳','Huevo roto'],['tuna','🐟','Atún'],['serr','🍗','Jamón serrano'],['parm','🟨','Parmesano'],['ruc','🥬','Rúcula'],['chick','🐔','Pollo'],['truf','⚫','Trufa'],['pimi','🟥','Pimiento rojo'],['alca','🥦','Alcachofas'],['tomr','🍅','Tomate rodajas'],['roq','🔵','Roquefort'],['cream','🤍','Queso crema'],['spin','🍃','Espinacas'],['kchick','🍢','Pollo kebab'],['ksauce','🥙','S. kebab'],['frik','🌭','Frikandela'],['cabra','🐐','Queso de cabra'],['eggc','🥚','Huevo cocido'],['corn','🌽','Maíz'],['salami','🟤','Salami'],['nuts','🌰','Nueces'],['miel','🍯','Miel'],['olive','🫒','Aceitunas negras'],['anch','🐠','Anchoas'],['alcap','🟢','Alcaparras'],['vegan','🌱','Queso vegano'],['oil','🔶','Aceite picante'],['extra','➕','Extra queso']];
const PZS=[['Prosciutto',['york'],810,1690],['Hawaiana',['york','pine'],880,1810],['Rústica',['tuna','onion'],880,1810],['Italiana',['serr','parm','ruc'],950,1930],['Kebab',['kchick','beef','ksauce'],950,1930],['Carbonara',['bacon','onion','carb'],950,1930],['Cremosa',['cream','garlic','spin'],950,1930],['Carnívora',['bacon','york','pep','beef'],1020,2050],['Frikandela',['bacon','frik','cabra'],1020,2050],['Bombay',['bacon','pine','chick','carb'],1020,2050],['Barbacoa',['bacon','onion','bbq','beef'],1020,2050],['Coyote',['garlic','onion','jala','pep'],1020,2050],['Gambas',['cherry','gambas','garlic'],1020,2050],['Del Monte',['miel','nuts','cabra','tomr'],1020,2050],['Vegetal',['alca','onion','mush','pimi'],1020,2050],['Ranchera',['bacon','chick','bbq','carb','beef'],1090,2170],['Serranita',['tomr','serr','roq','chick','eggr'],1090,2170],['Correcaminos',['bacon','onion','mush','york','eggr'],1090,2170],['Suprema',['onion','mush','serr','parm','truf'],1090,2170],['Del Jefe',['garlic','eggc','jala','york','corn','pep'],1160,2290]].map(([n,t,m,f])=>({n,t,m,f}));
const ING={};BI.concat(TP).forEach(([k,e,n])=>ING[k]=[e,n]);
const ORDER=TP.map(x=>x[0]),BASE=['sauce','oreg','cheese'],BAKE=7,BURN=13,TOTAL=240;
const fmt=c=>(c/100).toFixed(2).replace('.',',')+' €',tgt=n=>Math.min(150,40+n*6)*100;
const D=new Date(),SUM=D.getMonth()==6||D.getMonth()==7,START=SUM?1170:1140,TUE=D.getDay()==2;
const hh=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const cnt=l=>Math.min(ORDER.length,4+Math.floor((l-1)/3));
let S,AC,tt,MUTE=false,LV=1,WAL=0,TOT=0,UP={ov:0,bs:0,sp:0,cn:0},DB=null,USR=null,UID=null;
try{LV=+localStorage.getItem('pz-lv')||1;WAL=+localStorage.getItem('pz-w')||0;MUTE=localStorage.getItem('pz-mute')==='1';TOT=+localStorage.getItem('pz-tot')||0;UP=Object.assign(UP,JSON.parse(localStorage.getItem('pz-up')||'{}'))}catch(e){}
let NOTE='';try{const td=Math.floor((Date.now()-D.getTimezoneOffset()*6e4)/864e5),la=localStorage.getItem('pz-day'),m=la===null?0:Math.max(0,td-(+la)-1);if(m){WAL-=m*10000;NOTE='Llevabas '+m+(m==1?' día':' días')+' sin jugar: −'+fmt(m*10000)+' del monedero.'}localStorage.setItem('pz-day',td);localStorage.setItem('pz-w',WAL)}catch(e){}
function beep(f,d=.12){if(MUTE)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1500)}
const POS=Array.from({length:12},(_,j)=>{const a=j*2.4,r=40*Math.sqrt((j+.6)/12.6);return[50+r*Math.cos(a),50+r*Math.sin(a)]});
function pz(ing,st,s){let h=`<div class="pz ${st||''}" style="--s:${s}px">`;if(ing.includes('sauce'))h+='<i class="sa"></i>';if(ing.includes('cheese'))h+='<i class="ch"></i>';const tops=ing.filter(k=>!BASE.includes(k));tops.forEach((k,ki)=>POS.forEach((p,j)=>{if(j%tops.length==ki)h+=`<span class="tp" style="left:${p[0]}%;top:${p[1]}%">${ING[k][0]}</span>`}));return h+'</div>'}

function fly(i,j,ms){const a=document.querySelector('#oven .slot[data-i="'+i+'"]'),b=document.querySelector('#spots .spot[data-i="'+j+'"]');if(!a||!b||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const r=a.getBoundingClientRect(),q=b.getBoundingClientRect(),p=document.createElement('div'),ax=r.left+r.width/2-14,ay=r.top+r.height/2-14,bx=q.left+q.width/2-14,by=q.top+q.height/2-14;p.className='fx p';p.style.fontSize='28px';p.textContent='🍕';document.body.append(p);p.animate([{transform:`translate(${ax}px,${ay}px)`},{transform:`translate(${(ax+bx)/2}px,${Math.min(ay,by)-30}px)`,offset:.5},{transform:`translate(${bx}px,${by}px)`,opacity:.9}],{duration:ms,easing:'ease-in-out',fill:'forwards'});setTimeout(()=>p.remove(),ms+30)}
function worker(dt){S.wt=(S.wt||0)+dt;S.dv=S.dv||[];S.dv.forEach(d=>d.t-=dt);const dn=S.dv.filter(d=>d.t<=0);S.dv=S.dv.filter(d=>d.t>0);
 dn.forEach(d=>{if(S.oven[d.i]===d.o&&S.cust[d.j]===d.c){const keep=S.sel;S.sel=d.i;serve(d.j);if(keep!==null&&keep!==d.i&&S.oven[keep]&&S.oven[keep].st==='ready'){S.sel=keep;drawOven();drawCust()}}});
 if(S.wt<.5)return;S.wt=0;
 const cs=S.cust.filter(Boolean).sort((a,b)=>a.left-b.left),txt=c=>c.r.n+' '+c.r.t.map(k=>ING[k][0]).join('')+' '+(c.r.fam?'45':'30'),h=cs.map(txt).join('|');

function staff(dt){const L=UP.cn||0,n=1+(L>=2)+(L>=5);S.em=S.em||[];S.tray=S.tray||[];while(S.em.length<n)S.em.push({x:.05,st:'idle',f:EF[S.em.length]});
 S.em.forEach((e,i)=>{const k=tier(i);
  if(e.task&&S.cust.indexOf(e.task.c)<0){if(e.carry)S.tray.push(e.carry);e.carry=null;if(e.task.p)e.task.p.rs=null;e.task=null;e.st='idle';drawTray()}
  if(!e.task){let best=null;S.cust.forEach(c=>{if(c&&c.taken&&!c.rs){const p=S.tray.find(p=>!p.rs&&same(c,p));if(p&&(!best||c.left<best.c.left))best={c,p}}});
   if(best){best.c.rs=1;best.p.rs=1;e.task={type:'pick',c:best.c,p:best.p};e.tx=0;e.st='walk'}
   else{let c0=null;S.cust.forEach(c=>{if(c&&!c.taken&&!c.rs&&(!c0||c.left<c0.left))c0=c});
    if(c0){c0.rs=1;e.task={type:'take',c:c0};e.tx=cx(S.cust.indexOf(c0));e.st='walk'}else if(Math.abs(e.x-.05)>.01){e.tx=.05;e.st='walk'}else e.st='idle'}}

   else e.x+=Math.sign(d)*s}
